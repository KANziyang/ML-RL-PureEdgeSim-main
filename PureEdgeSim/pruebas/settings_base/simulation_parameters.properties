# ============================================================
#  Simulation Core
# ============================================================

# Simulation duration (minutes)
simulation_time=30

# Initialization time before simulation starts (seconds)
# Also used as the initial offset for charts
initialization_time=35

# Interval between update events (seconds), typically 0.1 ~ 1
# Larger values reduce precision
update_interval=1

# Fixed random seed for reproducible simulations
random_seed=12345

# Run simulations in parallel (disables real-time charts)
parallel_simulation=false

# Pause between iterations (seconds)
pause_length=1

# ============================================================
#  Task Completion
# ============================================================

# Wait for all tasks to finish after simulation time ends?
# true  = more accurate results, but much longer runtime
# false = higher task failure rate, but faster simulation
wait_for_all_tasks=false

# Maximum extra wait time if wait_for_all_tasks=true (seconds, 0=unlimited)
wait_for_all_tasks_limit=300

# ============================================================
#  Orchestration
# ============================================================

# Deploy orchestrator per edge device for cooperative scheduling?
enable_orchestrators=false

# Orchestrator deployment location: CLOUD | EDGE | MIST
deploy_orchestrator=EDGE

# Task offloading architecture (where tasks can be sent)
# Options: CLOUD_ONLY, EDGE_ONLY, MIST_ONLY, MIST_AND_CLOUD,
#          EDGE_AND_CLOUD, LOCAL_EDGE_CLOUD, ALL
# NOTE: Python training/test scripts override this at runtime
orchestration_architectures=LOCAL_EDGE_CLOUD

# Scheduling algorithms (comma-separated for batch comparison)
# Options: RANDOM, LOCAL, EDGE, CLOUD, ROUND_ROBIN,TRADE_OFF,
#          TRADE_OFF, INCREASE_LIFETIME, LATENCY_ENERGY_AWARE,
#          PPO, MAPPO
# NOTE: Python scripts override this per algorithm
orchestration_algorithms=RANDOM, LOCAL, EDGE, CLOUD, ROUND_ROBIN,TRADE_OFF, INCREASE_LIFETIME, LATENCY_ENERGY_AWARE,PPO, MAPPO

# ============================================================
#  Map & Topology
# ============================================================

# Simulation area (meters)
# If changed, update edge data center locations in edge_datacenters.xml
length=200
width=200

# Number of edge devices 
min_number_of_edge_devices=160
max_number_of_edge_devices=160
edge_device_counter_size=10

# Communication range between edge devices (meters)
edge_devices_range=40

# Edge data center coverage radius (meters)
# Be careful with EDGE_ONLY architecture — low coverage may cause task failures
edge_datacenters_coverage=120

# Effective distance for cloud-link PRB attenuation (meters)
cloud_coverage_distance=160

# ============================================================
#  Mobility
# ============================================================

# Edge device movement speed (m/s), 0 = static
#speed=1.4

# ============================================================
#  Network
# ============================================================

# WLAN bandwidth (Mbps)
wlan_bandwidth=5000

# WLAN PRB blocks (bandwidth divided into this many blocks)
wlan_prb_blocks=5000

# Max PRB ratio per task (0-1)
prb_task_max_ratio=0.01

# PRB distance attenuation parameters 
prb_distance_d0=20
prb_distance_alpha=0.5

# Propagation delay (seconds)
propogation_delay=0

# Propagation speed (m/s)
propogation_speed=300000000

# Network update interval (seconds)
# 0.1 = better accuracy / slower, 2+ = less detail / faster
network_update_interval=1

# Use realistic network model (more accurate but slower)
realistic_network_model=true

# ============================================================
#  Container Registry
# ============================================================

# Download application container on task offload?
# true  = device downloads container first (size defined in applications.xml)
# false = execute directly without download
enable_registry=false

# Registry location: CLOUD (extend DefaultNetworkModel for custom locations)
registry_mode=CLOUD

# ============================================================
#  CPU Allocation
# ============================================================

# SPACE_SHARED = virtual machines (default, faster)
# TIME_SHARED  = containers (much longer simulation time)
Applications_CPU_allocation_policy=SPACE_SHARED

# ============================================================
#  Energy Model
# ============================================================

# Energy per transmitted/received bit (J/bit)
consumed_energy_per_bit=0.00000005

# Amplifier dissipation — free space channel (J/bit/m^2)
amplifier_dissipation_free_space=0.00000000001

# Amplifier dissipation — multipath fading channel (J/bit/m^4)
amplifier_dissipation_multipath=0.0000000000000013

# ============================================================
#  Charts & Visualization
# ============================================================

# Show real-time charts during simulation
display_real_time_charts=false

# Auto-close charts when simulation ends
auto_close_real_time_charts=true

# Chart refresh interval (seconds)
charts_update_interval=1

# Save charts to disk
save_charts=true
save_simulation_charts=true
save_final_results_charts=false

# ============================================================
#  Logging
# ============================================================

save_log_file=true
clear_output_folder=false
deep_log_enabled=false
